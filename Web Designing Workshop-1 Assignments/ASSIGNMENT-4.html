<!DOCTYPE html>
<html lang="en">
<head>
    <title>Semantic Elements</title>
</head>
<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <main id="home">
        <section id="about">
            <h2>About Us</h2>

            <article>
                <h3>Our Mission</h3>
                <p>We learn and create websites using HTML.</p>
            </article>
        </section>

        <aside>
            <p>This is additional information.</p>
        </aside>
    </main>

    <footer id="contact">
        <p>Contact: student@example.com</p>
    </footer>

    <h2>Non-Semantic Layout Using div</h2>

    <div>
        <div><b>Header:</b> Website heading</div>
        <div><b>Content:</b> This content is placed inside div elements.</div>
        <div><b>Footer:</b> Copyright &copy; 2026</div>
    </div>

</body>
</html>
