<!DOCTYPE html>
<html lang="en">
<head>
    <title>Block and Inline Elements</title>
    <style>
        .block {
            background-color: lightblue;
            padding: 10px;
            margin: 8px 0;
        }

        .inline {
            background-color: yellow;
            padding: 4px;
        }
    </style>
</head>
<body>
    <h1>Block and Inline Elements</h1>

    <h2>Block Elements</h2>

    <div class="block">This is a div element.</div>
    <p class="block">This is a paragraph element.</p>

    <h2>Inline Elements</h2>

    <p>
        This is <span class="inline">a span element</span>
        inside a paragraph.

        Here is a <a href="https://www.example.com">link</a>
        and <strong>bold text</strong>.
    </p>
</body>
</html>
