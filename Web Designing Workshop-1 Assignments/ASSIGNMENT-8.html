<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hyperlinks and Images</title>
</head>
<body>

    <h1>Hyperlinks and Images</h1>

    <p>
        <a href="#details">Go to Details</a>
    </p>

    <p>
        <a href="https://www.wikipedia.org/"
           target="_blank">
           Visit Wikipedia
        </a>
    </p>

    <p>
        <a href="mailto:student@example.com">
            Send an Email
        </a>
    </p>

    <h2>Image with Attributes</h2>

    <a href="https://www.example.com/">
        <img src="https://placehold.co/320x180?text=Sample+Image"
             alt="Sample Image"
             width="320"
             height="180">
    </a>

    <h2 id="details">Details</h2>

    <p>This section is reached using an internal hyperlink.</p>

</body>
</html>
