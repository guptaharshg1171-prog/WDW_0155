<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form Validation</title>
</head>
<body>

    <h1>Student Details Form</h1>

    <form action="submit.php" method="post">

        <label for="name">Name:</label>
        <br>

        <input type="text"
               id="name"
               name="name"
               required
               minlength="3"
               maxlength="30">

        <br><br>

        <label for="email">Email:</label>
        <br>

        <input type="email"
               id="email"
               name="email"
               required>

        <br><br>

        <label for="mobile">Mobile (10 digits):</label>
        <br>

        <input type="text"
               id="mobile"
               name="mobile"
               pattern="[0-9]{10}"
               title="Enter exactly 10 digits"
               required>

        <br><br>

        <label for="password">Password (Minimum 8 characters):</label>
        <br>

        <input type="password"
               id="password"
               name="password"
               minlength="8"
               required>

        <br><br>

        <label for="age">Age (18 to 30):</label>
        <br>

        <input type="number"
               id="age"
               name="age"
               min="18"
               max="30"
               required>

        <br><br>

        <button type="submit">Submit</button>

        <button type="reset">Reset</button>

    </form>

</body>
</html>
