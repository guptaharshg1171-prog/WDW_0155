<!DOCTYPE html>
<html lang="en">
<head>
    <title>Class Timetable</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            text-align: center;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <h1>Class Timetable</h1>

    <table>
        <tr>
            <th>Day</th>
            <th>9:00-10:00</th>
            <th>10:00-11:00</th>
            <th>11:00-12:00</th>
            <th>12:00-1:00</th>
        </tr>

        <tr>
            <th>Monday</th>
            <td>HTML</td>
            <td>CSS</td>
            <td rowspan="5">Lunch Break</td>
            <td>Maths</td>
        </tr>

        <tr>
            <th>Tuesday</th>
            <td>Physics</td>
            <td>HTML</td>
            <td>English</td>
        </tr>

        <tr>
            <th>Wednesday</th>
            <td colspan="2">Web Designing Lab</td>
            <td>Maths</td>
        </tr>

        <tr>
            <th>Thursday</th>
            <td>CSS</td>
            <td>Physics</td>
            <td>English</td>
        </tr>

        <tr>
            <th>Friday</th>
            <td>Maths</td>
            <td>HTML</td>
            <td>Physics</td>
        </tr>
    </table>

</body>
</html>
