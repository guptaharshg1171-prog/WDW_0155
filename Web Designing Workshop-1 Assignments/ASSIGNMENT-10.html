<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML Multimedia</title>
</head>
<body>

    <h1>Multimedia in HTML</h1>

    <h2>Image</h2>
    <img src="sample-image.jpg"
         alt="Sample Image"
         width="320">

    <h2>Video</h2>
    <video width="420" controls>
        <source src="sample-video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

    <h2>Audio</h2>
    <audio controls>
        <source src="sample-audio.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <h2>YouTube Video</h2>
    <iframe width="420"
            height="236"
            src="https://www.youtube-nocookie.com/embed/ysz5S6PUM-U"
            title="YouTube Video"
            allowfullscreen>
    </iframe>

</body>
</html>
