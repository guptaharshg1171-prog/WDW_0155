<!DOCTYPE html>
<html lang="en">
<head>
    <title>Quotation and Citation</title>
</head>
<body>

    <h1>Quotation and Citation Elements</h1>

    <p>
        Here is a short quotation:
        <q>Knowledge is power.</q>
    </p>

    <blockquote cite="https://www.example.com/">
        Learning never stops. Every new skill gives us
        an opportunity to grow.
    </blockquote>

    <p>
        The book <cite>Wings of Fire</cite>
        is an autobiography by A. P. J. Abdul Kalam.
    </p>

    <p>
        <abbr title="World Wide Web Consortium">W3C</abbr>
        develops web standards.
    </p>

    <p>
        <bdo dir="rtl">
            This text is written from right to left.
        </bdo>
    </p>

</body>
</html>
